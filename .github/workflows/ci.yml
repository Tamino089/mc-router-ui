name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . --output-format=github

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest -q

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: mc-router-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name ci-mc-router-ui \
            -e ADMIN_PASSWORD=ci-test-password \
            -e LOG_LEVEL=ERROR \
            mc-router-ui:ci
          for attempt in $(seq 1 30); do
            if docker exec ci-mc-router-ui python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"; then
              echo "web UI is serving"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::health endpoint never became ready"
              docker logs ci-mc-router-ui
              exit 1
            fi
            sleep 2
          done
          echo "container runs as: $(docker exec ci-mc-router-ui id -un)"
          docker exec ci-mc-router-ui id -un | grep -qx app \
            || { echo "::error::container is not running as the unprivileged app user"; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs ci-mc-router-ui || true
      - name: Cleanup
        if: always()
        run: docker rm -f ci-mc-router-ui || true

  scan:
    name: Scan image
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build for scanning
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: mc-router-ui:scan
          cache-from: type=gha
      - name: Trivy
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # 0.30.0
        with:
          image-ref: mc-router-ui:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
