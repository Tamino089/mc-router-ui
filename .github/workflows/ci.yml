name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . --output-format=github

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: true
          tags: mc-router-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name ci-mc-router-ui \
            -e ADMIN_PASSWORD=ci-test-password \
            -e LOG_LEVEL=ERROR \
            mc-router-ui:ci
          for attempt in $(seq 1 30); do
            if docker exec ci-mc-router-ui python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"; then
              echo "web UI is serving"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::health endpoint never became ready"
              docker logs ci-mc-router-ui
              exit 1
            fi
            sleep 2
          done
          echo "services run as (read from /proc, the image has no ps):"
          # The entrypoint starts as root to repair the data directory, so assert
          # that the services themselves still run unprivileged.
          docker exec ci-mc-router-ui python3 -c "
          import os, pwd, sys
          found = {}
          for pid in filter(str.isdigit, os.listdir('/proc')):
              try:
                  with open('/proc/%s/cmdline' % pid, 'rb') as handle:
                      cmdline = handle.read().decode('utf-8', 'replace').replace(chr(0), ' ')
                  uid = os.stat('/proc/' + pid).st_uid
              except OSError:
                  continue
              if 'app.main:app' in cmdline:
                  found['uvicorn'] = uid
              elif 'api-binding' in cmdline:
                  found['mc-router'] = uid
          for name, uid in sorted(found.items()):
              print('  %-10s uid=%s (%s)' % (name, uid, pwd.getpwuid(uid).pw_name))
          missing = {'uvicorn', 'mc-router'} - set(found)
          wrong = {n: u for n, u in found.items() if u != 1000}
          if missing or wrong:
              sys.exit('::error::expected both services as uid 1000, got %s (missing %s)' % (found, missing))
          "
      - name: Smoke test the logs reach docker logs
        run: |
          # The services write to files that the entrypoint streams to the
          # container log, and supervisord mirrors its own activity log to stdout.
          # All of it must be visible without exec'ing into the container.
          check_log() {
            for _ in $(seq 1 10); do
              docker logs ci-mc-router-ui 2>&1 | grep -q "$1" && return 0
              sleep 1
            done
            echo "::error::$2"
            docker logs ci-mc-router-ui
            return 1
          }
          check_log "supervisord started" "supervisord's activity log is not in docker logs"
          check_log "Uvicorn running on" "the web UI's own output is not in docker logs"
      - name: Smoke test repair of a root-owned data directory
        run: |
          # Reproduce a bind mount left behind by an older install: a root-owned,
          # read-only database inside a directory the app user cannot write.
          docker volume create ci-mc-router-ui-data
          docker run --rm -v ci-mc-router-ui-data:/data --entrypoint /bin/sh \
            mc-router-ui:ci -c 'touch /data/mcrouter-ui.db && chmod 444 /data/mcrouter-ui.db && chown -R 0:0 /data && chmod 555 /data && ls -ld /data /data/mcrouter-ui.db'
          docker run -d --name ci-mc-router-ui-repair \
            -v ci-mc-router-ui-data:/data \
            -e ADMIN_PASSWORD=ci-test-password \
            -e LOG_LEVEL=ERROR \
            mc-router-ui:ci
          for attempt in $(seq 1 30); do
            if docker exec ci-mc-router-ui-repair python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"; then
              echo "web UI recovered a root-owned data directory"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::the web UI did not recover a root-owned data directory"
              docker logs ci-mc-router-ui-repair
              exit 1
            fi
            sleep 2
          done
          docker logs ci-mc-router-ui-repair 2>&1 | grep -q "taking ownership" \
            || { echo "::error::the entrypoint did not report repairing ownership"; exit 1; }
          docker exec ci-mc-router-ui-repair stat -c '%U:%G %a %n' /data /data/mcrouter-ui.db
      - name: Container logs
        if: always()
        run: |
          docker logs ci-mc-router-ui || true
          docker logs ci-mc-router-ui-repair || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f ci-mc-router-ui ci-mc-router-ui-repair || true
          docker volume rm ci-mc-router-ui-data || true

  scan:
    name: Scan image
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          load: true
          tags: mc-router-ui:scan
          cache-from: type=gha
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: mc-router-ui:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload results
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e
        with:
          sarif_file: trivy.sarif
