# ─────────────────────────────────────────────────────────────────────────────
# MC Router UI — All-in-one Container
#
# Unraid users: Configure environment variables directly in the Unraid Docker UI.
# All ports and paths are controlled via ENV — no need to edit this file.
#
# ⚠️  NETWORKING — READ THIS IF ROUTES NEVER SHOW "REACHABLE":
# Health checks and the Crafty integration both make a direct TCP/HTTP
# connection FROM this container TO your backend (Minecraft server / Crafty).
# On the default "bridge" network, Docker's embedded DNS does NOT resolve
# other containers by name (e.g. "crafty") unless they share a custom
# user-defined network with this one — so a backend like "crafty:25565" will
# simply never come up healthy, no matter how correct your setup is.
#
# Fix ONE of the following:
#   1. Set `network_mode: host` below (simplest — this container then behaves
#      like a normal process on the LAN and can reach anything by IP or
#      hostname the host itself can reach), OR
#   2. Put this container on the SAME user-defined Docker network as your
#      Minecraft/Crafty containers, OR
#   3. Always use routable LAN IPs (e.g. 192.168.1.50:25565) instead of
#      Docker container names in route "Backend" fields and CRAFTY_URL.
# ─────────────────────────────────────────────────────────────────────────────

services:
  mc-router-ui:
    build: .
    container_name: mc-router-ui
    restart: unless-stopped

    # Recommended: host networking so this container can reach LAN/Docker
    # backends the same way the Unraid host itself can. Comment this out and
    # uncomment the `ports:` block below only if you've put this container on
    # the same custom network as every backend it needs to reach.
    network_mode: host

    # ports:
    #   - "${MC_PORT:-25565}:25565"   # Minecraft — must be reachable via port-forwarding/DynDNS
    #   - "${UI_PORT:-8090}:8000"     # Web UI — place behind NPM/Cloudflare Tunnel

    environment:
      # ── mc-router ─────────────────────────────────────────────────────────
      MC_PORT:       ${MC_PORT:-25565}      # Minecraft ingress port (internal)
      API_PORT:      ${API_PORT:-8080}      # mc-router REST API (internal, not exposed)
      MC_ROUTER_API: http://localhost:${API_PORT:-8080}

      # ── Web UI ────────────────────────────────────────────────────────────
      DB_PATH:         /data/mcrouter-ui.db
      ADMIN_USERNAME:  ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:  ${ADMIN_PASSWORD:-changeme}   # CHANGE THIS!
      # SECRET_KEY is auto-generated on first start and persisted to the DB.
      # Optionally override: SECRET_KEY: your-own-secret

      # ── Cloudflare DDNS (optional) ────────────────────────────────────────
      # When adding a route, a DNS-only (grey cloud) A-record is created/updated.
      # IP changes are synced every DDNS_INTERVAL_SECONDS seconds automatically.
      CLOUDFLARE_API_TOKEN:    ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID:      ${CLOUDFLARE_ZONE_ID:-}
      # Alternative to ZONE_ID: provide zone name, ID is resolved automatically
      CLOUDFLARE_ZONE_NAME:    ${CLOUDFLARE_ZONE_NAME:-}
      DDNS_INTERVAL_SECONDS:   ${DDNS_INTERVAL_SECONDS:-300}

      # ── Crafty Controller (optional) ──────────────────────────────────────
      CRAFTY_URL:           ${CRAFTY_URL:-}
      CRAFTY_API_KEY:       ${CRAFTY_API_KEY:-}
      # Path to Crafty servers directory (for server.properties editing)
      CRAFTY_SERVERS_DIR:   ${CRAFTY_SERVERS_DIR:-}
      # Self-hosted Crafty almost always uses a self-signed TLS certificate.
      # Set to "true" if CRAFTY_URL is on your trusted local network — leave
      # unset/false if CRAFTY_URL points anywhere outside your LAN.
      CRAFTY_INSECURE_SKIP_VERIFY: ${CRAFTY_INSECURE_SKIP_VERIFY:-}

    volumes:
      - mc-router-ui-data:/data   # SQLite DB + persistence
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker socket (read-only) for route discovery

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Optional: host network mode for direct access to Docker-internal MC servers
    # network_mode: host

volumes:
  mc-router-ui-data:
