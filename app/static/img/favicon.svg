<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6821F"/>
      <stop offset="100%" stop-color="#FFAB40"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b1e"/>
      <stop offset="100%" stop-color="#2a2b30"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="32" height="32" rx="7" fill="url(#g2)"/>
  <!-- Pickaxe body -->
  <g transform="translate(4, 4) scale(0.75)">
    <!-- Handle -->
    <rect x="14" y="14" width="3" height="12" rx="1.5" fill="#9ca3af" transform="rotate(45 15.5 20)"/>
    <!-- Head -->
    <rect x="3" y="5" width="18" height="8" rx="2" fill="url(#g1)"/>
    <!-- Head tip left -->
    <polygon points="3,5 3,13 0,11 0,7" fill="#F6821F"/>
    <!-- Head tip right -->
    <polygon points="21,5 21,13 24,10 24,8" fill="#FFAB40"/>
  </g>
</svg>
