<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Router UI – Login</title>
<meta name="description" content="Sign in to manage your Minecraft server routing infrastructure.">
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/css/login.css?v=5">
<script>(function(){var t=localStorage.getItem('mc-theme')||'dark';document.documentElement.dataset.theme=t;})();</script>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>MC Router UI</h1>
  </div>

  {% if error %}
  <div class="error-alert" role="alert">
    <span class="error-alert-icon">⚠</span>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="post" action="/login" id="login-form" autocomplete="on">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        autofocus
        required
        value="{{ last_username or '' }}"
        placeholder="e.g. admin"
      >
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="••••••••"
        >
        <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="submit-btn">Sign In</button>
  </form>
</div>

<div class="footer-text">MC Router UI &nbsp;·&nbsp; Secure Connection</div>

<script>
document.getElementById('login-form').addEventListener('submit', function() {
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Signing in…';
  btn.classList.add('loading');
});

const pwInput = document.getElementById('password');
const pwToggle = document.getElementById('password-toggle');
pwToggle.addEventListener('click', () => {
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  pwToggle.setAttribute('aria-pressed', String(show));
  pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});
</script>
</body>
</html>
