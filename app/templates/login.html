<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Router UI – Login</title>
<meta name="description" content="Sign in to manage your Minecraft server routing infrastructure.">
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/css/login.css">
<script>(function(){var t=localStorage.getItem('mc-theme')||'dark';document.documentElement.dataset.theme=t;})();</script>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <!-- Pickaxe SVG icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div class="logo-info">
      <h1>MC Router UI</h1>
      <span>Minecraft Routing Panel</span>
    </div>
  </div>

  {% if error %}
  <div class="error-alert" role="alert">
    <span class="error-alert-icon">⚠</span>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="post" action="/login" id="login-form" autocomplete="on">
    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        autofocus
        required
        value="{{ last_username or '' }}"
        placeholder="e.g. admin"
      >
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="••••••••"
      >
    </div>
    <button type="submit" class="btn-login" id="submit-btn">Sign In</button>
  </form>
</div>

<div class="footer-text">MC Router UI &nbsp;·&nbsp; Secure Connection</div>

<script>
document.getElementById('login-form').addEventListener('submit', function() {
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Signing in…';
  btn.classList.add('loading');
});
</script>
</body>
</html>
