# Logging:
#
# The services run as an unprivileged user, and in Docker that user cannot
# re-open /dev/stdout (the container's stdout is a pipe owned by root), so
# supervisord cannot use /dev/stdout as a log file. Two mechanisms replace it:
#
#   * supervisord's own activity log is mirrored to stdout by supervisor itself
#     while running in the foreground (writing to the already-open stdout works
#     for any user). A file handler is always created, so it points at /dev/null.
#   * both programs write to files under LOG_DIR, and the entrypoint streams
#     those files to the container log with `tail -F`.
#
# Reopening /dev/stdout only works as root; do not change logfile back to it.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mc-router]
command=/usr/local/bin/mc-router --api-binding=0.0.0.0:%(ENV_API_PORT)s --port=%(ENV_MC_PORT)s
autostart=true
autorestart=true
startretries=5
startsecs=2
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_LOG_DIR)s/mc-router.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=%(ENV_LOG_DIR)s/mc-router-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

[program:web-ui]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/srv
autostart=true
autorestart=true
startretries=5
startsecs=3
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_LOG_DIR)s/web-ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=%(ENV_LOG_DIR)s/web-ui-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
