[supervisord]
nodaemon=true
user=app
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mc-router]
command=/usr/local/bin/mc-router --api-binding=0.0.0.0:%(ENV_API_PORT)s --port=%(ENV_MC_PORT)s
autostart=true
autorestart=true
startretries=5
startsecs=2
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/mc-router.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/mc-router-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

[program:web-ui]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/srv
autostart=true
autorestart=true
startretries=5
startsecs=3
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/web-ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/web-ui-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
