# Everything logs to stdout/stderr so `docker logs` (and the unRAID log viewer)
# shows it. Non-seekable log files require log rotation to be off, and `silent`
# stops supervisord from writing its activity log to stdout twice.
[supervisord]
nodaemon=true
silent=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mc-router]
command=/usr/local/bin/mc-router --api-binding=0.0.0.0:%(ENV_API_PORT)s --port=%(ENV_MC_PORT)s
autostart=true
autorestart=true
startretries=5
startsecs=2
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web-ui]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/srv
autostart=true
autorestart=true
startretries=5
startsecs=3
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
