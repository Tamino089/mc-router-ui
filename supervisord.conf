[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:mc-router]
; mc-router binary — reads MC_PORT and API_PORT from environment
command=/bin/sh -c '/usr/local/bin/mc-router --api-binding=0.0.0.0:%(ENV_API_PORT)s --port=%(ENV_MC_PORT)s'
autostart=true
autorestart=true
startretries=5
startsecs=2
priority=10
stdout_logfile=/var/log/supervisor/mc-router.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/mc-router-err.log
stderr_logfile_maxbytes=5MB

[program:web-ui]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/srv
autostart=true
autorestart=true
startretries=5
startsecs=3
priority=20
stdout_logfile=/var/log/supervisor/web-ui.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/web-ui-err.log
stderr_logfile_maxbytes=5MB
