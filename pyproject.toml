[project]
name = "mc-router-ui"
version = "1.0.0"
description = "Self-hosted web UI for mc-router with Cloudflare DDNS, Crafty Controller integration, and Docker label discovery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.142.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "app/static"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    "S104",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S105"]
"app/db/schema.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
