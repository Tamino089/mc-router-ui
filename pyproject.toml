[project]
name = "mc-router-ui"
version = "1.0.0"
description = "Self-hosted web UI for mc-router with Cloudflare DDNS, Crafty Controller integration, and Docker label discovery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "app/static"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    # Bind-all is intentional: the app runs inside a container behind a proxy.
    "S104",
    # Assertions are used in tests, not in application code.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
